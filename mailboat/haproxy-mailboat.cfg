# haproxy-mailboat.cfg -- mailboat: route JSON messages on named fields.
#
# Runs as a USER process (haproxy -f), not the system service. Every path
# comes from the environment, so nothing machine-specific lives here:
#
#   MAILBOAT_DIR          the directory holding mailboat*.lua
#   MAILBOAT_SOCK         the unix socket to listen on (created mode 0600)
#   MAILBOAT_BACKEND      where valid local messages go, e.g. unix@/path/shim.sock
#   MAILBOAT_LOCAL_SCOPE  this system's c:x scope (read by mailboat.lua)
#
# Exposure is narrow by default: a unix socket that only this user can
# reach. Requests carrying an Origin header are refused, so a web page
# cannot use mailboat even if a TCP bind is added later; any TCP bind must be
# 127.0.0.1 only. "from" is self-asserted, which is acceptable ONLY while the
# listener is local; a non-local bind needs sender authentication first.

global
  tune.lua.bool-sample-conversion normal
  lua-prepend-path "${MAILBOAT_DIR}/?.lua"
  lua-load "${MAILBOAT_DIR}/mailboat.lua"

defaults
  mode http
  timeout client 10s
  timeout server 30s
  timeout connect 5s
  option http-buffer-request

frontend mailboat
  bind "unix@${MAILBOAT_SOCK}" mode 600

  # Nothing from the sender may pose as mailboat's own routing headers.
  http-request del-header x-mailboat-from
  http-request del-header x-mailboat-to
  http-request del-header x-mailboat-kind
  http-request del-header x-mailboat-priority
  http-request del-header x-mailboat-readback
  http-request del-header x-mailboat-body-offset
  http-request del-header x-mailboat-body-length

  # Browsers send Origin; mailboat's callers are local processes, never pages.
  http-request deny deny_status 403 if { req.hdr_cnt(origin) gt 0 }

  # One endpoint for messages; /health passes straight to the backend, which
  # owns the stop decision (see README.md). Every rule below that touches a
  # message is guarded by is_msg.
  acl is_msg path /v1/msg
  acl is_health path /health
  http-request deny deny_status 405 if is_msg !METH_POST
  http-request deny deny_status 405 if is_health !METH_GET
  http-request deny deny_status 404 if !is_msg !is_health

  # Validate, then route on the variables the action sets -- never on text.
  http-request lua.mailboat if is_msg
  http-request return status 400 content-type application/json lf-string "%[var(txn.mb_reply)]" hdr 6a24-status "%[var(txn.mb_cell)]" if is_msg { var(txn.mb_status) -m int 400 }
  http-request return status 413 content-type application/json lf-string "%[var(txn.mb_reply)]" hdr 6a24-status "%[var(txn.mb_cell)]" if is_msg { var(txn.mb_status) -m int 413 }
  http-request return status 403 content-type application/json lf-string "%[var(txn.mb_reply)]" hdr 6a24-status "%[var(txn.mb_cell)]" if is_msg { var(txn.mb_status) -m int 403 }
  # Fail closed: a message the action did not explicitly accept is refused.
  http-request deny deny_status 500 if is_msg !{ var(txn.mb_ok) -m bool }

  # Urgent and important traffic queues first. Priority orders; it never bypasses.
  http-request set-priority-class var(txn.mb_prio_class) if is_msg

  # The routing fields, for the backend's convenience (it may re-read the body).
  http-request set-header x-mailboat-from %[var(txn.mb_from)] if is_msg
  http-request set-header x-mailboat-to %[var(txn.mb_to)] if is_msg
  http-request set-header x-mailboat-kind %[var(txn.mb_kind)] if is_msg
  http-request set-header x-mailboat-priority %[var(txn.mb_prio)] if is_msg
  http-request set-header x-mailboat-readback %[var(txn.mb_readback)] if is_msg { var(txn.mb_readback) -m len gt 0 }
  # kind json: where the nested message sits in the body, for an exact slice
  http-request set-header x-mailboat-body-offset %[var(txn.mb_body_offset)] if is_msg { var(txn.mb_body_offset) -m found }
  http-request set-header x-mailboat-body-length %[var(txn.mb_body_length)] if is_msg { var(txn.mb_body_length) -m found }

  # Every message reply carries the proxy's own 6A24 status; the backend's
  # body is never touched.
  http-response set-header 6a24-status %[var(txn.mb_cell)] if { var(txn.mb_cell) -m found }
  http-response set-header 6a24-readback %[var(txn.mb_readback)] if { var(txn.mb_readback) -m len gt 0 }

  default_backend be_local

backend be_local
  # The backend answers GET /health with 503 when it wants traffic stopped,
  # which closes mailboat's front door within one check interval. It fails
  # closed: a backend that is down closes the door too.
  option httpchk GET /health
  http-check expect status 200
  server local "${MAILBOAT_BACKEND}" check inter 2s fall 1 rise 1
